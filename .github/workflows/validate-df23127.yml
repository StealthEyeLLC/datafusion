name: Validate DataFusion 23127

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  targeted-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/df-23127-20260710
      - name: Check formatting
        run: cargo fmt --check
      - name: Test partial and final dictionary transport
        run: cargo test -p datafusion-physical-plan dictionary_groups_keep_partial_schema_and_promote_final_output -- --nocapture
      - name: Test monotonic dictionary promotion
        run: cargo test -p datafusion-physical-plan dict_uint8_utf8_promotes_and_does_not_shrink -- --nocapture
      - name: Test legacy single-stage promotion
        run: cargo test -p datafusion-physical-plan dictionary_group_key_promotes_runtime_schema -- --nocapture
      - name: Test SQL dictionary promotion
        run: cargo test --test sqllogictests -- dictionary_group_by_key_promotion
      - name: Run clippy for library and tests
        run: cargo clippy -p datafusion-physical-plan --lib --tests -- -D warnings
