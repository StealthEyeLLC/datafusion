name: Validate DataFusion 23127

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/df-23127-20260710
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy -p datafusion-physical-plan --all-targets -- -D warnings 2>&1 | tee /tmp/df23127-clippy.log
      - name: Persist clippy failure log
        if: steps.clippy.outcome == 'failure'
        run: |
          mkdir -p validation
          cp /tmp/df23127-clippy.log validation/df23127-clippy.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/df23127-clippy.log
          git commit -m "ci: capture df23127 clippy failure [skip ci]"
          git push origin HEAD:validate/df-23127-20260710
      - name: Fail when clippy fails
        if: steps.clippy.outcome == 'failure'
        run: exit 1
